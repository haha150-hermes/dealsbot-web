services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: deals-api:latest
    container_name: deals-api
    restart: unless-stopped
    environment:
      AMAZON_ASSOCIATE_TAG: "${AMAZON_ASSOCIATE_TAG:?Set AMAZON_ASSOCIATE_TAG}"
    volumes:
      - /mnt/dealsbot/deals.db:/data/deals.db:ro
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: deals-web:latest
    container_name: deals-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "443:8443"
    volumes:
      - /etc/letsencrypt/live/deals.symeri.se:/etc/letsencrypt/live/deals.symeri.se:ro
      - /etc/letsencrypt/archive/deals.symeri.se:/etc/letsencrypt/archive/deals.symeri.se:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true
